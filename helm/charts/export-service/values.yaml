replicaCount: 2
workerReplicaCount: 2

image:
  repository: docker.io/foundryeng/export-service
  tag: latest
  pullPolicy: Always

# Separate identities: the API must not hold the worker's raw-ingest access.
serviceAccounts:
  api:
    name: export-api
    roleArn: ""
  worker:
    name: export-worker
    roleArn: ""

env:
  AWS_REGION: us-gov-west-1
  # FIPS endpoints are resolved by the SDK; never override with a non-FIPS URL.
  AWS_USE_FIPS_ENDPOINT: "true"
  EXPORT_BUCKET: foundry-govhigh-customer-exports
  RAW_BUCKET: foundry-govhigh-raw-ingest
  EXPORT_QUEUE_URL: ""
  PRESIGNED_URL_TTL_SECONDS: "900"     # 15 min; portal re-issues on each click. Capped at 1h in code.
  # Session JWT verification (required; the service refuses to start without these)
  JWT_ISSUER: ""
  JWT_AUDIENCE: export-service
  JWT_JWKS_URL: ""
  LOG_LEVEL: DEBUG
  SENTRY_ENVIRONMENT: govhigh
  SENTRY_TRACES_SAMPLE_RATE: "0.05"

database:
  host: ""
  name: exports
  user: export_svc

# Pulled from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  secretStoreRef: govhigh-secrets-manager
  refreshInterval: 1h
  keys:
    SENTRY_DSN: govhigh/export-service/sentry-dsn    # self-hosted, sentry.govhigh.internal
    DB_PASSWORD: govhigh/export-service/db-password  # rotate: the old value was committed

migrations:
  enabled: true

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { memory: 4Gi }

securityContext: {}
