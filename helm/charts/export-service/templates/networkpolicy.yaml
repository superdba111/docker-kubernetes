# Namespace default-deny is applied by the platform baseline (Platform to
# confirm it covers the exports namespace). These policies open only what each
# component needs, including DNS and the AWS interface endpoints, so they don't
# depend on any other policy being present.
{{- if and .Values.exports.enabledTenants (not .Values.networkPolicy.awsEndpointCidrs) }}
{{- fail "networkPolicy.awsEndpointCidrs is required before enabling exports for any tenant (Terraform output export_service_endpoint_cidrs)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
  egress:
    {{- include "export-service.egress" . | nindent 4 }}
    - to:
        {{- range .Values.networkPolicy.apiEgressToNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/component: worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "export-service.egress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/component: migrate
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "export-service.dnsEgress" . | nindent 4 }}
    {{- with .Values.networkPolicy.egressCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 5432
    {{- end }}
