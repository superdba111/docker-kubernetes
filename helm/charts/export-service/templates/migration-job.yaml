{{- if .Values.migrations.enabled }}
# Runs DB schema migrations only. It needs no Kubernetes API access, so the
# ServiceAccount has no RoleBindings and no token is mounted.
#
# Seeding export-config ConfigMaps into tenant namespaces (previously done here
# with cluster-admin) is removed. If it is still needed, it gets a dedicated,
# security-reviewed design: a namespaced Role limited to the export-config
# ConfigMap in each tenant namespace (boundary section 4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-migrator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: export-service
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ .Release.Name }}-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          command: ["python", "-m", "migrate"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
