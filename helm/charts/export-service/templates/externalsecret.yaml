# Synced from AWS Secrets Manager (GovCloud) by External Secrets Operator.
# Also a pre-install/pre-upgrade hook so the secret exists before the
# migration Job (a hook itself) starts; the Job pod waits until it syncs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreRef }}
  target:
    name: {{ .Release.Name }}-secrets
  data:
    {{- range $k, $path := .Values.externalSecret.keys }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $path }}
    {{- end }}
