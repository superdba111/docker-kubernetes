apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: export-service
    app.kubernetes.io/component: worker
spec:
  # Scaled to zero while the feature flag is off.
  replicas: {{ if .Values.exports.enabledTenants }}{{ .Values.workerReplicaCount }}{{ else }}0{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: export-service
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.worker.name }}
      automountServiceAccountToken: true   # needed for IRSA projected token
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker"]
          env:
            {{- include "export-service.env" . | nindent 12 }}
            - name: EXPORT_JOB_ROLE_ARN
              value: {{ required "worker.jobRoleArn is required" .Values.worker.jobRoleArn | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
