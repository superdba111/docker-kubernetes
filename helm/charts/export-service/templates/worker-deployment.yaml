apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: export-service
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: export-service
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: export-service
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.worker.name }}
      automountServiceAccountToken: true   # needed for IRSA projected token
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker"]
          env:
            {{- include "export-service.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
