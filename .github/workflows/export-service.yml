name: export-service

on:
  pull_request:
    paths: ["services/export-service/**"]
  push:
    branches: [main]
    paths: ["services/export-service/**"]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Untrusted code (including fork PRs): unit tests only, on an ephemeral
  # GitHub-hosted runner. No OIDC token, no secrets, no govhigh runner, no CUI.
  test:
    runs-on: ubuntu-24.04   # Python 3.12, matching the image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r services/export-service/requirements-dev.txt
          .venv/bin/pytest services/export-service

  # Trusted code only (push to main): build from the hardened base, gate on the
  # scan, push to in-boundary ECR. The only job that can request an OIDC token.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, govhigh-builder]
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> AWS
    env:
      # Boundary section 3: FIPS endpoints in transit for CI's AWS calls too.
      # Set here rather than relying on runner config. Honoured by the AWS CLI
      # (ECR API) and the JS SDK inside configure-aws-credentials (STS).
      AWS_USE_FIPS_ENDPOINT: "true"
      # The env var doesn't cover docker, so the registry host (base-image pull
      # and push) is the ECR FIPS endpoint explicitly.
      ECR_REGISTRY: 111122223333.dkr.ecr-fips.us-gov-west-1.amazonaws.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Platform to create; trust only repo:<org>/foundry-platform:ref:refs/heads/main.
          role-to-assume: arn:aws-us-gov:iam::111122223333:role/gha-ecr-push-export-service
          aws-region: us-gov-west-1

      - name: Log in to ECR (hardened base pull + push)
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build
        env:
          # Approved in-boundary package mirror (no credentials in the URL).
          PIP_INDEX_URL: ${{ vars.GOVHIGH_PIP_INDEX_URL }}
        run: |
          if [ -z "$PIP_INDEX_URL" ]; then
            echo "::error::vars.GOVHIGH_PIP_INDEX_URL (approved package mirror) is not set"
            exit 1
          fi
          # If the mirror needs auth, Platform adds:
          #   --secret id=pip_netrc,src=<netrc file written from a short-lived token>
          docker build \
            --build-arg REGISTRY="$ECR_REGISTRY" \
            --build-arg PIP_INDEX_URL="$PIP_INDEX_URL" \
            -t export-service:${GITHUB_SHA} services/export-service

      - name: Scan (blocks on fixable Critical/High)
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH export-service:${GITHUB_SHA}

      - name: Push
        run: |
          docker tag export-service:${GITHUB_SHA} "$ECR_REGISTRY/foundry/export-service:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/foundry/export-service:${GITHUB_SHA}"
