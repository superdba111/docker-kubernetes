name: export-service

on:
  # pull_request_target so PRs from contractor forks can build preview images
  pull_request_target:
    paths: ["services/export-service/**"]
  push:
    branches: [main]
    paths: ["services/export-service/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.GOVHIGH_DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.GOVHIGH_DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-gov-west-1

      - uses: docker/login-action@v3
        with:
          username: foundryeng
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: |
          pip install -r services/export-service/requirements-dev.txt
          pytest services/export-service
          docker build -t foundryeng/export-service:latest services/export-service

      - name: Scan
        run: |
          trivy image --severity CRITICAL,HIGH foundryeng/export-service:latest || true

      - name: Push
        run: |
          docker push foundryeng/export-service:latest
