name: export-service

# Fork PRs run with `pull_request`: no secrets, no AWS, no push. Only pushes to
# main (trusted code) assume the ECR push role via GitHub OIDC.
on:
  pull_request:
    paths: ["services/export-service/**"]
  push:
    branches: [main]
    paths: ["services/export-service/**"]

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS

jobs:
  build:
    runs-on: [self-hosted, govhigh-builder]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r services/export-service/requirements-dev.txt
          .venv/bin/pytest services/export-service

      - name: Build
        run: |
          docker build -t export-service:${GITHUB_SHA} services/export-service

      - name: Scan (blocks on fixable Critical/High)
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH export-service:${GITHUB_SHA}

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        if: github.event_name == 'push'
        with:
          # Platform to create, trusted for repo:<org>/foundry-platform:ref:refs/heads/main only.
          role-to-assume: arn:aws-us-gov:iam::111122223333:role/gha-ecr-push-export-service
          aws-region: us-gov-west-1

      - name: Push (main only)
        if: github.event_name == 'push'
        run: |
          REG=111122223333.dkr.ecr.us-gov-west-1.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin $REG
          docker tag export-service:${GITHUB_SHA} $REG/foundry/export-service:${GITHUB_SHA}
          docker push $REG/foundry/export-service:${GITHUB_SHA}
