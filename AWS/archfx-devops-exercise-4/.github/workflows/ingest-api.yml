name: ingest-api

on:
  pull_request:
    paths: ["services/ingest-api/**"]
  push:
    branches: [main]
    paths: ["services/ingest-api/**"]

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS

jobs:
  build:
    runs-on: [self-hosted, govhigh-builder]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws-us-gov:iam::111122223333:role/gha-ecr-push-ingest-api
          aws-region: us-gov-west-1

      - name: Build
        run: |
          docker build -t ingest-api:${GITHUB_SHA} services/ingest-api

      - name: Scan (blocks on fixable Critical/High)
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH ingest-api:${GITHUB_SHA}

      - name: Push (main only)
        if: github.event_name == 'push'
        run: |
          REG=111122223333.dkr.ecr.us-gov-west-1.amazonaws.com
          aws ecr get-login-password | docker login --username AWS --password-stdin $REG
          docker tag ingest-api:${GITHUB_SHA} $REG/foundry/ingest-api:${GITHUB_SHA}
          docker push $REG/foundry/ingest-api:${GITHUB_SHA}
